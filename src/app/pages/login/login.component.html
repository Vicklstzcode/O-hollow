<!-- Main container with entrance animation -->
<div class="min-h-screen bg-black relative overflow-hidden text-white opacity-0" 
     [class.fade-in]="isReady()">

  <!-- Background Image -->
  <div class="absolute inset-0 transition-opacity duration-1000">
    <img src="https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2071&auto=format&fit=crop" 
         alt="" class="w-full h-full object-cover" />
    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/50 to-black"></div>
  </div>

  <!-- Grid Overlay -->
  <div class="absolute inset-0 grid-overlay opacity-50"></div>

  <!-- Floating Orbs/Particles -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    @for (i of orbIndices; track i) {
      <div class="absolute w-2 h-2 rounded-full blur-sm animate-pulse bg-gradient-to-r"
           [ngClass]="getOrbColor(i)"
           [ngStyle]="getOrbPosition(i)">
      </div>
    }
  </div>

  <!-- Ambient Glow -->
  <div class="absolute top-1/3 left-1/4 w-96 h-96 from-purple-600 to-pink-600 rounded-full blur-[120px] opacity-20 animate-pulse"></div>
  <div class="absolute bottom-1/3 right-1/4 w-96 h-96 from-cyan-600 to-purple-600 rounded-full blur-[120px] opacity-20 animate-pulse-delay"></div>

  <!-- Mobile Container -->
  <div class="relative z-10 min-h-screen flex flex-col justify-center items-center px-4">
    
    <div class="w-full max-w-md space-y-8">
      <!-- Logo -->
      <div class="flex justify-center fade-in-up stagger-1">
        <div class="flex items-center gap-2">
          <svg class="w-8 h-8 text-purple-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
          </svg>
          <span class="text-3xl font-medium bg-gradient-to-r from-purple-300 to-pink-300 bg-clip-text text-transparent">
            Mysticos
          </span>
        </div>
      </div>

      <!-- Login Form Card -->
      <div class="bg-black/30 backdrop-blur-xl border border-white/10 rounded-3xl p-8 space-y-6 fade-in-up stagger-2">
        <div class="text-center">
          <h1 class="text-2xl font-bold text-white">Bem-vindo de Volta</h1>
          <p class="text-purple-300/80">Entre para acessar o Santuário.</p>
        </div>
        
        <form class="space-y-4" (ngSubmit)="fazerLogin()">
          <div class="relative">
            <input
              type="text"
              name="username"
              [(ngModel)]="loginData.username"
              placeholder="Nome de usuário"
              required
              class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all duration-300"
            />
          </div>
          <div class="relative">
            <input
              [type]="mostrarSenha ? 'text' : 'password'"
              name="password"
              [(ngModel)]="loginData.password"
              placeholder="Senha"
              required
              class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all duration-300"
            />
            <button type="button" (click)="alternarVisualizacaoSenha()" class="absolute right-3 top-1/2 -translate-y-1/2 text-purple-300/70 hover:text-purple-300">
              <svg *ngIf="!mostrarSenha" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              <svg *ngIf="mostrarSenha" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 .946-3.11 3.564-5.394 6.83-6.167M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.5 4.5l15 15" /></svg>
            </button>
          </div>
          <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:shadow-[0_0_20px_rgba(168,85,247,0.5)] transition-all duration-300 font-bold text-white">
            Entrar no Santuário
          </button>
        </form>
      </div>

      <!-- Social & Register links -->
      <div class="text-center space-y-6 fade-in-up stagger-3">
        <div class="flex items-center justify-center gap-4">
          <div class="flex-grow h-px bg-white/10"></div>
          <span class="text-sm text-white/40">Ou continue com</span>
          <div class="flex-grow h-px bg-white/10"></div>
        </div>

        <div class="flex justify-center gap-4">
          <button (click)="loginGoogle()" class="w-14 h-14 flex items-center justify-center bg-white/5 border border-white/10 rounded-full hover:bg-white/10 transition-colors">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-6 h-6">
          </button>
          <button (click)="loginDiscord()" class="w-14 h-14 flex items-center justify-center bg-white/5 border border-white/10 rounded-full hover:bg-white/10 transition-colors">
            <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.2199 2.7811C18.9199 2.0511 17.5199 1.5411 15.9999 1.2511C15.9399 1.3711 15.8699 1.5011 15.7999 1.6311C14.7999 3.4911 13.0699 4.9511 10.9999 5.6811C10.9999 5.6811 11.2699 5.8611 11.4599 6.0111C13.4399 5.8411 15.2299 5.2411 16.7199 4.3011C16.5999 4.5411 16.4899 4.7911 16.3799 5.0411C15.6599 5.6311 14.8699 6.1311 14.0299 6.5511C13.2999 6.8411 12.5399 7.0811 11.7599 7.2411C10.4299 7.4911 9.07991 7.4211 7.74991 7.0311C6.41991 6.6411 5.22991 5.9511 4.22991 5.0611C4.12991 4.8811 4.02991 4.7011 3.92991 4.5211C5.41991 5.4611 7.20991 6.0611 9.18991 6.2311C9.37991 6.0811 9.64991 5.9011 9.64991 5.9011C7.57991 5.1711 5.84991 3.7111 4.84991 1.8511C4.77991 1.7211 4.70991 1.5911 4.64991 1.4711C3.12991 1.7611 1.72991 2.2711 0.429914 2.9911C0.189914 3.0911 0 3.3211 0 3.5811V19.0611C0 20.3011 1.01991 21.2911 2.24991 21.2911H2.74991C2.79991 21.2911 2.83991 21.2911 2.87991 21.2911C2.89991 21.2911 2.91991 21.2911 2.93991 21.2911C3.19991 21.2911 3.42991 21.1411 3.53991 20.9111C4.60991 19.3411 6.00991 18.0611 7.64991 17.1511C7.64991 17.1511 7.72991 17.1111 7.79991 17.0711C7.80991 17.0711 7.80991 17.0611 7.80991 17.0611C7.80991 17.0611 7.80991 17.0611 7.80991 17.0611C7.87991 17.0211 7.94991 16.9811 8.01991 16.9411C8.01991 16.9411 8.01991 16.9411 8.01991 16.9411C8.08991 16.9011 8.14991 16.8611 8.21991 16.8211C8.21991 16.8211 8.21991 16.8211 8.21991 16.8211C8.28991 16.7811 8.34991 16.7411 8.41991 16.7011C9.69991 16.0911 11.0999 15.7511 12.5199 15.7511C13.9399 15.7511 15.3399 16.0911 16.6199 16.7011C16.6899 16.7411 16.7499 16.7811 16.8199 16.8211C16.8199 16.8211 16.8199 16.8211 16.8199 16.8211C16.8899 16.8611 16.9499 16.9011 17.0199 16.9411C17.0199 16.9411 17.0199 16.9411 17.0199 16.9411C17.0899 16.9811 17.1699 17.0211 17.2299 17.0711C18.8699 18.0011 20.2699 19.2911 21.3399 20.8611C21.4499 21.0911 21.6799 21.2411 21.9399 21.2411C21.9599 21.2411 21.9799 21.2411 21.9999 21.2411C22.0399 21.2411 22.0799 21.2411 22.1299 21.2411H22.6299C23.8599 21.2411 24 20.2211 24 19.061             </svg>
          </button>
        </div>
        
        <p class="text-sm text-white/50">
          Novo por aqui? 
          <button (click)="abrirModalCadastro()" class="font-medium text-purple-300 hover:text-purple-200 transition-colors">
            Crie sua conta.
          </button>
        </p>
      </div>
    </div>

  </div>
</div>

<!-- Registration Modal -->
<div *ngIf="exibirModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" (click)="fecharModalCadastro()">
  <div class="w-full max-w-md bg-black/50 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 space-y-6 fade-in-up" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-white">Crie sua Conta</h2>
        <button (click)="fecharModalCadastro()" class="text-white/50 hover:text-white">&times;</button>
    </div>
    
    <form class="space-y-4" (ngSubmit)="fazerCadastro()">
      <input type="text" name="regUsername" [(ngModel)]="cadastroData.username" placeholder="Nome de usuário" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all">
      <input type="email" name="regEmail" [(ngModel)]="cadastroData.email" placeholder="Email" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all">
      <input type="password" name="regPassword" [(ngModel)]="cadastroData.password" placeholder="Senha" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all">
      <input type="password" name="confirmPassword" [(ngModel)]="cadastroData.confirmPassword" placeholder="Confirme a Senha" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all">
      <select name="regAffiliation" [(ngModel)]="cadastroData.affiliation" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all custom-select">
        <option value="" disabled selected>Escolha sua Afiliação</option>
        <option value="heroi">Herói</option>
        <option value="vilao">Vilão</option>
        <option value="neutro">Neutro</option>
      </select>
      <input type="text" name="regOrigin" [(ngModel)]="cadastroData.origin" placeholder="Qual sua origem? (Ex: Asgard)" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all">
      
      <div class="pt-2">
        <div class="flex items-start gap-3">
          <input id="lgpdAccept" type="checkbox" name="lgpdAccept" [(ngModel)]="lgpdAceito" required class="mt-1 h-4 w-4 accent-purple-500">
          <label for="lgpdAccept" class="text-sm text-white/60">
            Eu aceito os <a href="#" class="text-purple-300 hover:underline">Termos de Serviço</a> e a <a href="#" class="text-purple-300 hover:underline">Política de Privacidade</a>.
          </label>
        </div>
      </div>

      <button type="submit" [disabled]="!lgpdAceito" class="w-full py-4 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:shadow-[0_0_20px_rgba(168,85,247,0.5)] transition-all font-bold text-white disabled:opacity-50 disabled:cursor-not-allowed">
        Criar Conta
      </button>
    </form>
  </div>
</div>
